<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found — Usman Ghani</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background-color: #020617;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      .card { text-align: center; max-width: 30rem; }
      .code {
        font-size: 4.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(90deg, #818cf8, #c084fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: 1.25rem; font-weight: 600; margin-top: 0.5rem; }
      p { color: #94a3b8; font-size: 0.95rem; margin-top: 0.75rem; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        background: linear-gradient(90deg, #6366f1, #8b5cf6);
        color: #fff;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 0.7rem 1.4rem;
        border-radius: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>The link may be old or the page may have moved. Everything on this portfolio lives on one page.</p>
      <a href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
